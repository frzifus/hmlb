---
apiVersion: "openebs.io/v1beta3"
kind: DiskPool
metadata:
  # Replacement for the failed SanDisk SSD PLUS (old pool storage1-cache-ssd is
  # stuck Terminating with no disk; new name avoids the collision). New disk:
  # Intenso 500GB. See runbooks/openebs-cache-disk-replacement.md.
  name: storage1-cache-ssd-2026-09-16
  namespace: openebs
spec:
  node: storage1
  disks: ["/dev/disk/by-id/ata-INTENSO_SSD_1642509006000529"]
  topology:
    labelled:
      type: cache
---
apiVersion: "openebs.io/v1beta3"
kind: DiskPool
metadata:
  name: storage2-cache-ssd
  namespace: openebs
spec:
  node: storage2
  disks: ["/dev/disk/by-id/ata-SanDisk_Ultra_II_480GB_164803A01AD1"]
  topology:
    labelled:
      type: cache
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-cache
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
parameters:
  protocol: nvmf
  repl: "2"
  thin: "true"
  fsType: xfs
  poolAffinityTopologyLabel: |
    type: cache
allowVolumeExpansion: true
provisioner: io.openebs.csi-mayastor
reclaimPolicy: Delete # Retain
