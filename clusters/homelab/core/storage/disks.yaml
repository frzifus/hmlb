---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-disks
  namespace: openebs
spec:
  suspend: true # TEMP: storage1 cache disk swap - see runbooks/openebs-cache-disk-replacement.md
  path: ./clusters/homelab/core/storage
  sourceRef:
    kind: GitRepository
    name: homelab-repo
    namespace: flux-system
  prune: true
  interval: 10m
  # NOTE: dependsOn across across different resource kinds does not work.
  # We do a few retries instead:
  # See: https://github.com/fluxcd/flux2/discussions/1599
  retryInterval: 1m

