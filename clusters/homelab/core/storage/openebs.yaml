---
apiVersion: v1
kind: Namespace
metadata:
  name: openebs
  labels:
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 1h
  url: https://openebs.github.io/openebs
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mayastor
  namespace: openebs
spec:
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  interval: 1h
  targetNamespace: openebs
  chart:
    spec:
      chart: openebs
      sourceRef:
        kind: HelmRepository
        name: openebs
      version: 4.5.1
  values:
    alloy:
      enabled: false
    loki:
      enabled: false
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: true
    mayastor:
      # Keep OpenEBS control-plane components on ordinary client nodes.
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations: []
      alloy:
        enabled: false
      csi:
        node:
          # currently necessary because the init container checks for nvmeof module but Talos compiles it in
          initContainers:
            enabled: false
          # TODO(storage-protection): remove csi-node scheduling on storage nodes.
          # tolerations: []
      etcd:
        replicaCount: 3
        tolerations: []
      eventing:
        enabled: false
      # TODO(storage-protection): remove agent-ha-node scheduling on storage nodes.
      # agents:
      #   ha:
      #     node:
      #       tolerations: []
      io_engine:
        # It's the automatic mode, in the DPDK code IOVA_MODE_DC, that causes issues.
        # Confirmed by EAL debug log output that this really selects VA
        envcontext: "iova-mode=va"
        nodeSelector:
          kubernetes.io/arch: amd64
          openebs.io/engine: mayastor
        tolerations:
          - key: role
            operator: Equal
            value: storage-node
      loki-stack:
        enabled: false
      obs:
        callhome:
          enabled: false
      storageClass:
        # we can't override reclaimPolicy so just make the classes explicit in base-config
        enabled: false
