---
apiVersion: v1
kind: Namespace
metadata:
  name: node-feature-discovery
  labels:
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: node-feature-discovery
  namespace: node-feature-discovery
spec:
  interval: 30m
  url: https://github.com/kubernetes-sigs/node-feature-discovery
  ref:
    tag: v0.19.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-feature-discovery
  namespace: node-feature-discovery
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: node-feature-discovery
  path: /deployment/overlays/default
  prune: true
  timeout: 10m
  # the upstream overlay ships its own unlabeled Namespace which, applied
  # under the same kustomize-controller field manager, strips the PSA labels
  # set by the namespace manifest here — the cluster-wide admission default is
  # baseline, and nfd-worker needs hostPath volumes, so re-assert privileged
  patches:
    - patch: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: node-feature-discovery
          labels:
            pod-security.kubernetes.io/audit: privileged
            pod-security.kubernetes.io/enforce: privileged
            pod-security.kubernetes.io/warn: privileged
      target:
        kind: Namespace
        name: node-feature-discovery
