apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: backend
  namespace: observability
spec:
  config:
    exporters:
      otlp:
        endpoint: backend-signoz-otel-collector.observability.svc.cluster.local:4317
        tls:
          insecure: true
    processors:
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      resource/cluster:
        attributes:
        - action: upsert
          key: k8s.cluster.name
          value: homelab
      transform/host_name:
        log_statements:
        - context: resource
          statements:
          - set(attributes["host.name"], attributes["k8s.node.name"]) where attributes["k8s.node.name"] != nil
        metric_statements:
        - context: resource
          statements:
          - set(attributes["host.name"], attributes["k8s.node.name"]) where attributes["k8s.node.name"] != nil
        trace_statements:
        - context: resource
          statements:
          - set(attributes["host.name"], attributes["k8s.node.name"]) where attributes["k8s.node.name"] != nil
      # trim high-churn/high-byte resource attributes from METRICS only (traces
      # and logs keep them). each attribute multiplies into every series of
      # every histogram; process.pid/telemetry.sdk.* churn force new
      # time_series + metadata rows on every rollout. os.version and host.arch
      # stay as requested. 2026-10-14.
      transform/trim_metric_attrs:
        metric_statements:
        - context: resource
          statements:
          - delete_key(attributes, "process.pid")
          - delete_key(attributes, "process.command_args")
          - delete_key(attributes, "process.command")
          - delete_key(attributes, "process.owner")
          - delete_key(attributes, "process.executable.path")
          - delete_key(attributes, "telemetry.sdk.name")
          - delete_key(attributes, "telemetry.sdk.language")
          - delete_key(attributes, "telemetry.sdk.version")
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    service:
      pipelines:
        logs:
          exporters:
          - otlp
          processors:
          - memory_limiter
          - resource/cluster
          - transform/host_name
          - batch
          receivers:
          - otlp
        metrics:
          exporters:
          - otlp
          processors:
          - memory_limiter
          - resource/cluster
          - transform/host_name
          - transform/trim_metric_attrs
          - batch
          receivers:
          - otlp
        traces:
          exporters:
          - otlp
          processors:
          - memory_limiter
          - resource/cluster
          - transform/host_name
          - batch
          receivers:
          - otlp
      telemetry:
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
  configVersions: 3
  daemonSetUpdateStrategy: {}
  deploymentUpdateStrategy: {}
  httpRoute:
    enabled: false
    gateway: ''
  ingress:
    route: {}
  ipFamilyPolicy: SingleStack
  managementState: managed
  mode: deployment
  networkPolicy: {}
  observability:
    metrics: {}
  podDnsConfig: {}
  podManagementPolicy: Parallel
  replicas: 2
  resources: {}
  targetAllocator:
    allocationStrategy: consistent-hashing
    collectorNotReadyGracePeriod: 30s
    collectorTargetReloadInterval: 30s
    filterStrategy: relabel-config
    observability:
      metrics: {}
    prometheusCR:
      evaluationInterval: 30s
      podMonitorNamespaceSelector: {}
      probeNamespaceSelector: {}
      scrapeConfigNamespaceSelector: {}
      scrapeInterval: 30s
      serviceMonitorNamespaceSelector: {}
    resources: {}
  upgradeStrategy: automatic
