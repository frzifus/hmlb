apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: signoz
  namespace: observability
spec:
  url: https://charts.signoz.io
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backend
  namespace: observability
spec:
  releaseName: backend
  interval: 30m
  chart:
    spec:
      chart: signoz
      version: "0.140.0"
      sourceRef:
        kind: HelmRepository
        name: signoz
        namespace: observability
  install:
    createNamespace: false
  upgrade:
    crds: CreateReplace
  values:
    clickhouse:
      persistence:
        size: 50Gi
      # only general worker nodes (worker1, gpu2) - never control-plane or storage nodes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
                  - key: role
                    operator: NotIn
                    values: ["storage-node"]
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "4"
          memory: 6Gi
      zookeeper:
        # only general worker nodes - never control-plane or storage nodes
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/worker
                      operator: Exists
                    - key: role
                      operator: NotIn
                      values: ["storage-node"]
    queryService:
      configVars:
        storage:
          metrics_ttl_duration_hrs: 720
          traces_ttl_duration_hrs: 24
          logs_ttl_duration_hrs: 24
    signoz:
      # only general worker nodes - never control-plane or storage nodes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
                  - key: role
                    operator: NotIn
                    values: ["storage-node"]
    otelCollector:
      # only general worker nodes - never control-plane or storage nodes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
                  - key: role
                    operator: NotIn
                    values: ["storage-node"]
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 4Gi
    telemetryStoreMigrator:
      # only general worker nodes - never control-plane or storage nodes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
                  - key: role
                    operator: NotIn
                    values: ["storage-node"]