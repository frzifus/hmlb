apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: signoz
  namespace: observability
spec:
  url: https://charts.signoz.io
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backend
  namespace: observability
spec:
  releaseName: backend
  interval: 30m
  chart:
    spec:
      chart: signoz
      version: "0.145.0"
      sourceRef:
        kind: HelmRepository
        name: signoz
        namespace: observability
  install:
    createNamespace: false
  upgrade:
    crds: CreateReplace
  values:
    clickhouse:
      persistence:
        size: 50Gi
      # keep ClickHouse internal system logs on a short leash - they ballooned to
      # ~40GiB of the 50GiB PVC (mostly trace_log, ~6GiB/day since 2026-10-05),
      # leaving <10GiB for actual SigNoz telemetry. see 2026-10-09 disk incident.
      clickhouseOperator:
        traceLog:
          ttl: 1
        processorsProfileLog:
          ttl: 1
        queryLog:
          ttl: 1
        partLog:
          ttl: 1
        # metric_log snapshots every CH table/part hourly-ish; it bloats with
        # part churn (914MiB, 21/30 active merges during the 2026-10-10
        # spanmetrics incident). default ttl is 30d - same leash as above.
        metricLog:
          ttl: 1
      # only general worker nodes (worker1, gpu2) - never control-plane or storage nodes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
                  - key: role
                    operator: NotIn
                    values: ["storage-node"]
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "4"
          # bumped 6Gi -> 8Gi on 2026-10-13: ch was at its 5.4GiB internal cap,
          # overcommit tracker killed every trace/log insert (code 241) and the
          # otel collectors crashlooped/OOMKilled retrying. gpu2 has headroom.
          memory: 8Gi
      zookeeper:
        # only general worker nodes - never control-plane or storage nodes
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/worker
                      operator: Exists
                    - key: role
                      operator: NotIn
                      values: ["storage-node"]
    queryService:
      configVars:
        storage:
          metrics_ttl_duration_hrs: 720
          traces_ttl_duration_hrs: 24
          logs_ttl_duration_hrs: 24
    signoz:
      # only general worker nodes - never control-plane or storage nodes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
                  - key: role
                    operator: NotIn
                    values: ["storage-node"]
    otelCollector:
      # only general worker nodes - never control-plane or storage nodes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
                  - key: role
                    operator: NotIn
                    values: ["storage-node"]
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 4Gi
      config:
        # safety valve - see 2026-10-13 incident: clickhouse hit its memory cap,
        # rejected inserts (code 241), and the collector retried inline with
        # unbounded buffering until the pod was OOMKilled 26x, pinning worker2
        # at ~98% cpu. memory_limiter refuses/drops new batches before the pod
        # limit; the bounded non-blocking queues drop failed exports beyond 100
        # requests instead of buffering forever.
        processors:
          memory_limiter:
            check_interval: 1s
            limit_mib: 3072
            spike_limit_mib: 512
        exporters:
          clickhousetraces:
            retry_on_failure:
              enabled: true
            sending_queue:
              enabled: true
              num_consumers: 4
              queue_size: 100
          clickhouselogsexporter:
            retry_on_failure:
              enabled: true
            sending_queue:
              enabled: true
              num_consumers: 4
              queue_size: 100
        service:
          pipelines:
            logs:
              processors: [memory_limiter, batch]
            metrics:
              processors: [memory_limiter, batch]
            metrics/meter:
              processors: [memory_limiter, batch/meter]
            traces:
              # signozspanmetrics/delta removed 2026-10-14: span-derived metrics
              # (signoz_latency.*) alone held 316k live series and were a major
              # driver of ClickHouse CPU (insert churn in samples_v4 /
              # time_series_v4 / metadata). disable via the traces pipeline;
              # cost is traces->metrics correlation in the SigNoz UI.
              processors: [memory_limiter, signozspanmapper, signozllmpricing, batch]
    telemetryStoreMigrator:
      # only general worker nodes - never control-plane or storage nodes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
                  - key: role
                    operator: NotIn
                    values: ["storage-node"]
