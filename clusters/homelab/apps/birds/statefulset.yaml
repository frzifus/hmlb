---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flappy-race
  namespace: birds
  labels:
    app.kubernetes.io/name: flappy-race
    app.kubernetes.io/instance: birds
spec:
  serviceName: flappy-race
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flappy-race
      app.kubernetes.io/instance: birds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flappy-race
        app.kubernetes.io/instance: birds
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 65532
      containers:
        - name: flappy-race
          image: ghcr.io/frzifus/flappy-race:0.1.1
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 15m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: state
              mountPath: /data
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.2
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - --protocol
            - http2
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-secret
                  key: tunnel-token
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          ports:
            - containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 64Mi
        storageClassName: openebs-crucial