---
# Internal path for VPN users: wildcard DNS *.klimlive.de resolves to the
# envoy gateway, so this route serves birds.klimlive.de inside the LAN.
# External users come in through the cloudflared tunnel sidecar instead.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: birds
  namespace: birds
spec:
  parentRefs:
    - name: services
      namespace: infra
      sectionName: main
  hostnames: [
    "birds.klimlive.de"
  ]
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: flappy-race
          port: 80