---
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-public-proxy-config
  namespace: immich
data:
  config.json: |
    {
      "ipp": {
        "showHomePage": false,
        "maxDownloadQuality": "original",
        "maxZoomQuality": "preview",
        "downloadFromImmichConcurrencyLimit": 5,
        "allowDownload": 2,
        "showMetadata": {
          "description": {
            "caption": true,
            "sidebar": true
          },
          "exif": {
            "dateTimeOriginal": true,
            "timeZone": true,
            "dimensions": true,
            "fileSize": true,
            "make": true,
            "model": true,
            "lensModel": true,
            "exposureTime": true,
            "iso": true,
            "fNumber": true,
            "focalLength": true
          },
          "location": {
            "city": true,
            "state": true,
            "country": true
          }
        },
        "gallery": {
          "showTitle": true,
          "showDescription": true,
          "showDownloadZip": true,
          "singleItemAutoOpen": true,
          "groupByDate": true
        },
        "lightbox": {
          "showArrows": true,
          "showDownload": true,
          "autoPlayVideos": false
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-public-proxy
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-public-proxy
    app.kubernetes.io/instance: immich
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-public-proxy
      app.kubernetes.io/instance: immich
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-public-proxy
        app.kubernetes.io/instance: immich
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: immich-public-proxy
              app.kubernetes.io/instance: immich
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: immich-public-proxy
          image: alangrainger/immich-public-proxy:3.2.0
          env:
            # The proxy talks to Immich only over the in-cluster Service; Immich itself
            # is never made a Cloudflare Tunnel origin.
            - name: IMMICH_URL
              value: http://immich-server.immich.svc.cluster.local:2283
            - name: PUBLIC_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudflared-secret
                  key: public-base-url
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /share/healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /share/healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            # The image declares its user as the non-numeric name "node".  Set its
            # numeric identity so kubelet can enforce the pod's runAsNonRoot policy.
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.2
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - --protocol
            - http2
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-secret
                  key: tunnel-token
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: immich-public-proxy-config
