apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# New open-webui stack: CNPG Postgres (pgvector), SeaweedFS (S3), Valkey,
# app Deployment (openwebui-web) and the HTTPRoute serving llm.klimlive.de
# (openwebui-web live, legacy open-webui backend at weight 0 in route.yaml).
# The legacy apps/llm/openwebui.yaml (v1 Deployment/Service) was removed at
# decommission; its PVC open-webui-data is kept as a rollback source.
resources:
  - postgres.yaml
  - valkey.yaml
  - seaweedfs.yaml
  - seaweedfs-secret.yaml
  - seaweedfs-s3-credentials.yaml
  - web.yaml
  - route.yaml
