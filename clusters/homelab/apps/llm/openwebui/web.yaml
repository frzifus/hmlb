---
# openwebui-web — the open-webui Deployment/Service on the shared stack:
# CNPG Postgres + pgvector, SeaweedFS (S3) storage, Valkey; emptyDir scratch
# (durable state entirely external). 2 replicas, RollingUpdate.
apiVersion: v1
kind: Service
metadata:
  name: openwebui-web
  namespace: llm
spec:
  selector:
    app: openwebui-web
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui-web
  namespace: llm
spec:
  # 2 replicas: exercised cross-replica streaming (Valkey) + concurrent S3
  # buffers while off-traffic during the parallel run.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: openwebui-web
  template:
    metadata:
      labels:
        app: openwebui-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-webui
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: ghcr.io/open-webui/open-webui:v0.13.3
          ports:
            - containerPort: 8080
          env:
            - name: ENABLE_API_KEYS
              value: "true"
            - name: JWT_EXPIRES_IN
              value: "-1"
            # One connection per semicolon-separated entry; index order must
            # match OPENAI_API_KEYS and OPENAI_API_CONFIGS. Same wiring as v1:
            # 0-2 hermes agents (Responses API), 3 praxis inference gateway.
            - name: OPENAI_API_BASE_URLS
              value: "http://hermes-research:8642/v1;http://hermes-hass:8642/v1;http://hermes-homelab:8642/v1;http://inference:80/v1"
            - name: OPENAI_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: openwebui-secrets
                  key: OPENAI_API_KEYS
            - name: OPENAI_API_CONFIGS
              value: '{"0": {"api_type": "responses"}, "1": {"api_type": "responses"}, "2": {"api_type": "responses"}, "3": {}}'
            # Pinned JWT signing key, shared with v1 so issued tokens stay
            # valid across both instances during the parallel run.
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-secret-key
                  key: WEBUI_SECRET_KEY
            # Background tasks (title/tags/follow-up/query generation) — same
            # dual config as v1.
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"
            - name: TASK_MODEL
              value: "glm-5.3-flash:cloud"
            - name: TASK_MODEL_EXTERNAL
              value: "glm-5.3-flash"
            - name: ENABLE_OTEL
              value: "true"
            - name: ENABLE_OTEL_TRACES
              value: "true"
            - name: ENABLE_OTEL_METRICS
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://backend-collector.observability.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: AUDIO_TTS_ENGINE
              value: "openai"
            - name: AUDIO_TTS_MODEL
              value: "chatterbox-nano"
            - name: AUDIO_TTS_VOICE
              value: "default"
            - name: AUDIO_TTS_SPLIT_ON
              value: "punctuation"
            - name: AUDIO_TTS_API_KEY
              value: "fake"
            - name: AUDIO_TTS_OPENAI_API_BASE_URL
              value: "http://chatterbox-nano:8000/v1"
            - name: AUDIO_STT_ENGINE
              value: "openai"
            - name: AUDIO_STT_OPENAI_API_BASE_URL
              value: "http://whisper-open-ai:8000/v1"
            - name: AUDIO_STT_API_KEY
              value: "fake"
            - name: AUDIO_STT_MODEL
              value: "whisper-1"
            # Env-driven config so both replicas (and v1 during the parallel
            # run) cannot drift: admin config stays out of the database.
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            - name: ENABLE_OAUTH_PERSISTENT_CONFIG
              value: "false"
            - name: ENABLE_LOGIN_FORM
              value: "false"
            - name: ENABLE_SIGNUP
              value: "false"
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: DEFAULT_USER_ROLE
              value: "user"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: OPENID_PROVIDER_URL
              value: "https://auth.klimlive.de/application/o/llm/.well-known/openid-configuration"
            - name: OAUTH_SCOPES
              valueFrom:
                secretKeyRef:
                  name: openwebui-secrets
                  key: OAUTH_SCOPES
            - name: OAUTH_PROVIDER_NAME
              valueFrom:
                secretKeyRef:
                  name: openwebui-secrets
                  key: OAUTH_PROVIDER_NAME
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: openwebui-secrets
                  key: OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openwebui-secrets
                  key: OAUTH_CLIENT_SECRET
            # --- shared new stack (v2 only; v1 stays on PVC/SQlite) ---
            # CNPG uses the user-provided initdb secret (openwebui-secrets) as
            # the owner credentials, so no auto-generated openwebui-postgres-app
            # secret exists. The uri key in openwebui-secrets assembles
            # postgresql://<username>:<password>@openwebui-postgres-rw.../openwebui.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openwebui-secrets
                  key: uri
            - name: VECTOR_DB
              value: "pgvector"
            # PGVECTOR_DB_URL defaults to DATABASE_URL — nothing to set.
            # The vector extension is created by CNPG bootstrap (superuser),
            # so the app must not try (and fail) to create it itself:
            - name: PGVECTOR_CREATE_EXTENSION
              value: "False"
            - name: REDIS_URL
              value: "redis://openwebui-valkey.llm.svc.cluster.local:6379/0"
            - name: WEBSOCKET_MANAGER
              value: "redis"
            - name: STORAGE_PROVIDER
              value: "s3"
            - name: S3_ENDPOINT_URL
              value: "http://openwebui-seaweedfs.llm.svc.cluster.local:8333"
            - name: S3_ADDRESSING_STYLE
              value: "path"
            - name: S3_BUCKET_NAME
              value: "openwebui"
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: openwebui-seaweedfs-s3-credentials
                  key: access-key
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-seaweedfs-s3-credentials
                  key: secret-key
            # Drop local copies after S3 push / on download so the emptyDir
            # stays small (transfer buffers + cache dirs only).
            - name: STORAGE_LOCAL_CACHE
              value: "False"
          volumeMounts:
            - mountPath: /app/backend/data
              name: data
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
