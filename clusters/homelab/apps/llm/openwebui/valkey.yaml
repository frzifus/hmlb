---
# Valkey for open-webui multi-replica coordination:
# REDIS_URL (token revocation, rate limiting, response streams) and
# WEBSOCKET_MANAGER=redis (live updates across replicas).
# Content is disposable — pub/sub, counters and short-lived streams only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui-valkey
  namespace: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openwebui-valkey
      app.kubernetes.io/instance: llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openwebui-valkey
        app.kubernetes.io/instance: llm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: docker.io/valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openwebui-valkey
  namespace: llm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openwebui-valkey
    app.kubernetes.io/instance: llm
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
