---
# SeaweedFS as S3-compatible object storage for open-webui
# (STORAGE_PROVIDER=s3): uploaded files and generated images.
# Pattern copied from apps/docs/seaweedfs.yaml, single replica.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openwebui-seaweedfs
  namespace: llm
spec:
  serviceName: openwebui-seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openwebui-seaweedfs
      app.kubernetes.io/instance: llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openwebui-seaweedfs
        app.kubernetes.io/instance: llm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: chrislusf/seaweedfs:4.53
          args:
            - "server"
            - "-dir=/data"
            - "-s3"
            - "-s3.config=/etc/seaweedfs/s3.json"
            - "-filer"
            - "-ip.bind=0.0.0.0"
            # Default max (30GB-disk heuristic -> 4) saturates on a multi-
            # collection layout: each bucket gets its own collection layout and
            # needs at least one writable volume of its own. Allow many.
            - "-volume.max=64"
          ports:
            - name: master
              containerPort: 9333
            - name: volume
              containerPort: 8080
            - name: filer
              containerPort: 8888
            - name: s3
              containerPort: 8333
          readinessProbe:
            httpGet:
              path: /cluster/status
              port: 9333
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /cluster/status
              port: 9333
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
      volumes:
        - name: s3-config
          secret:
            secretName: openwebui-seaweedfs-s3-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: openebs-cache
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openwebui-seaweedfs
  namespace: llm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openwebui-seaweedfs
    app.kubernetes.io/instance: llm
  ports:
    - name: s3
      protocol: TCP
      port: 8333
      targetPort: 8333
    - name: filer
      protocol: TCP
      port: 8888
      targetPort: 8888
