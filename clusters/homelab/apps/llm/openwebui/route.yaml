---
# HTTPRoute for llm.klimlive.de — serves the new openwebui-web deployment
# (CNPG Postgres/pgvector, SeaweedFS, Valkey stack).
#
# The legacy open-webui Deployment/Service (apps/llm/openwebui.yaml, SQLite on
# PVC open-webui-data) was decommissioned at cutover; its PVC is kept as a
# rollback source. If rollback is ever needed: restore the legacy manifest via
# git history and give its backendRef weight here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  namespace: llm
  # labels:
  #   external-dns: "true"
spec:
  parentRefs:
    - name: services
      namespace: infra
      sectionName: main
  hostnames: [
    "llm.klimlive.de"
  ]
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: openwebui-web
          port: 3000
          weight: 1
