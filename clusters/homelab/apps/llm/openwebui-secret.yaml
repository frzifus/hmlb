# WEBUI_SECRET_KEY — the secret OpenWebUI uses to sign JWT API tokens and derive
# OAuth session encryption keys. If unset, OpenWebUI generates a random one at
# every startup, which invalidates all previously-issued API tokens (and logs
# out OAuth users) on each restart. Pinning it here makes API tokens survive
# restarts so external clients (local Claude / Pi) don't need a new token each
# time. NOTE: plaintext here for now — sops-encrypt before relying on it in git.
