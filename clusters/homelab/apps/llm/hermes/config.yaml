---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: llm
data:
  config.yaml: |
    # Schema version of this config (current hermes schema: 39). Hermes
    # treats a missing version as ~2 years old and refuses auto-migration;
    # bump manually when hermes ships new migrations (config is read-only
    # in the pod, so migrations must land here in git).
    _config_version: 39
    plugins:
      enabled:
        - hermes_otel
        # Runs discover_mcp_tools() in-process on first session start — the
        # api_server platform never bootstraps MCP on its own (upstream
        # hermes-agent #69746), so without this the gateway registry stays
        # empty and /v1/chat/completions turns see no MCP tools.
        - mcp_bootstrap
    web:
      backend: searxng
    model:
      provider: custom
      model: glm-5.3-flash:cloud
      base_url: http://ollama.llm.svc.cluster.local:11434/v1
      api_key: "none"
    # Streamable-HTTP MCP servers (probed 2026-09-02). ${VAR} in headers
    # resolves from pod env (see MCP_GITHUB_API_KEY in statefulset.yaml).
    mcp_servers:
      kubernetes:
        url: http://mcp-k8s-server:8080/mcp
      signoz:
        url: http://mcp-signoz-server:8080/mcp
      github:
        url: http://github-mcp:8080/mcp
        auth: header
        headers:
          Authorization: Bearer ${MCP_GITHUB_API_KEY}
          # HTTP-mode github-mcp-server ignores GITHUB_READ_ONLY (stdio-only);
          # per-request enforcement is via this header (github-mcp-server
          # issue #2156). Server-side: write tools are not advertised and
          # calls to them are rejected.
          X-MCP-Readonly: "true"
