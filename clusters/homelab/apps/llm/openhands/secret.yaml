# OpenHands secret material, two keys in one Secret:
#   secret-key.txt        — OH_SECRET_KEY for settings/secrets encryption,
#                           mounted read-only as ~/.openhands/agent-canvas/
#                           secret-key.txt (see server-statefulset.yaml). The
#                           entrypoint reuses this file instead of auto-generating
#                           a per-PVC key, so encrypted settings survive PVC loss.
#   LOCAL_BACKEND_API_KEY — the agent-server session API key (the "single
#                           user-facing env var" per the entrypoint). Injected as
#                           an env var in the StatefulSet so the entrypoint uses
#                           it directly instead of auto-generating api-key.txt on
#                           the PVC. Pinned to the value the pod originally
#                           generated, so OpenWebUI's configured bearer token and
#                           existing conversations keep working.
#
# Values reused from the original in-cluster pod so existing conversations'
# embedded encrypted secrets still decrypt and the session token OpenWebUI uses
# stays valid. NOTE: plaintext here for now — sops-encrypt this file (age
# recipient in repo-root .sops.yaml) before relying on it in git.
apiVersion: v1
kind: Secret
metadata:
    name: openhands-secret-key
    namespace: llm
    labels:
        app: openhands
type: Opaque
