---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openhands
  namespace: llm
automountServiceAccountToken: false

---
apiVersion: v1
kind: Service
metadata:
  name: openhands
  namespace: llm
  labels:
    app: openhands
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app: openhands
