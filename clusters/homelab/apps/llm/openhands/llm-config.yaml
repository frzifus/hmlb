---
# OpenHands LLM configuration, pinned in Git and mounted read-only into the
# pod over the PVC paths (see server-statefulset.yaml). The api_key is plaintext
# "ollama" because:
#   - ollama does not enforce auth (any non-empty bearer works);
#   - openhands' validate_secret() only decrypts gAAAAA-prefixed (Fernet) values,
#     so a plain string passes through regardless of OH_SECRET_KEY.
# If a real LLM API key is ever needed, move it to the openhands-secret-key
# Secret instead of storing it plaintext here.
#
# Captured verbatim from the working in-cluster state; changes are a
# `kubectl apply -k .` + pod restart (the UI cannot save over these read-only
# mounts, which is the intended "config cannot drift" guarantee).
apiVersion: v1
kind: ConfigMap
metadata:
  name: openhands-llm-config
  namespace: llm
  labels:
    app: openhands
data:
  settings.json: |
    {
      "schema_version": 2,
      "agent_settings": {
        "schema_version": 5,
        "agent_kind": "openhands",
        "agent": "CodeActAgent",
        "llm": {
