          "api_key": "ollama",
          "auth_type": "api_key",
          "subscription_vendor": null,
          "base_url": "http://ollama.llm.svc.cluster.local:11434/v1",
          "api_version": null,
          "aws_access_key_id": null,
          "aws_secret_access_key": null,
