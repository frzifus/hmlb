---
# OpenHands Agent Canvas — main server (frontend + agent-server + automation).
# Single-replica StatefulSet backed by a PVC. LLM config is Git-pinned via the
# openhands-llm-config ConfigMap: the init-dirs container copies it into writable
# in-memory dirs (profiles/, agent-profiles/) and onto the PVC (settings.json)
# so the UI can switch profiles / patch settings, while a pod restart resets all
# config back to Git. OH_SECRET_KEY is mounted read-only. Exposed on
# agents.klimlive.de (no SSO).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openhands
  namespace: llm
  labels:
    app: openhands
spec:
  serviceName: openhands
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: openhands
  template:
    metadata:
      labels:
        app: openhands
    spec:
      serviceAccountName: openhands
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        # Materialize the Git-pinned LLM config from the ConfigMap into
        # writable volumes the main container uses. profiles/ and agent-profiles/
        # are in-memory emptyDirs (fresh each pod start, so no stale profile files
        # like an old default.json can resurface); settings.json is copied onto the
        # PVC. This lets the UI switch agent profiles / patch settings during a
        # session (those write active_agent_profile_id into settings.json), while
        # Git stays the source of truth: a pod restart re-runs this container and
        # resets all config to the ConfigMap. Runtime state (conversations, auth,
        # cache) lives elsewhere on the PVC and is never overlaid here.
        - name: init-dirs
          image: ghcr.io/openhands/agent-canvas:1.16.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              set -e
              && mkdir -p /home/openhands/.openhands/agent-canvas
              && cp /config/settings.json          /home/openhands/.openhands/settings.json
              && cp /config/glm-5.3.json           /home/openhands/.openhands/profiles/glm-5.3.json
              && cp /config/glm-5.3-flash.json     /home/openhands/.openhands/profiles/glm-5.3-flash.json
              && cp /config/homelab.json           /home/openhands/.openhands/agent-profiles/homelab.json
              && cp /config/house.json             /home/openhands/.openhands/agent-profiles/house.json
              && chmod 0660 /home/openhands/.openhands/settings.json /home/openhands/.openhands/profiles/*.json /home/openhands/.openhands/agent-profiles/*.json
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /home/openhands/.openhands
              subPath: openhands
            # ConfigMap source of truth (read-only) — consumed only here.
            - name: config
              mountPath: /config
              readOnly: true
            # In-memory config dirs the main container also mounts (shared pod volume).
            - name: profiles-mem
              mountPath: /home/openhands/.openhands/profiles
            - name: agent-profiles-mem
              mountPath: /home/openhands/.openhands/agent-profiles
      containers:
        - name: agent-canvas
          image: ghcr.io/openhands/agent-canvas:1.16.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PORT
              value: "8000"
            - name: AGENT_SERVER_PORT
              value: "18000"
            - name: AUTOMATION_PORT
              value: "18001"
            # Pin the agent-server session API key so it is deterministic across
            # pod/PVC recreation instead of auto-generated in api-key.txt. The
            # entrypoint uses LOCAL_BACKEND_API_KEY directly (its documented
            # override) and skips the file. OH_SESSION_API_KEYS_0 MUST also be set
            # to the same value: the agent-server only binds 0.0.0.0 (reachable via
            # the openhands-agent-server Service) when it sees this env var, else it
            # falls back to 127.0.0.1 loopback and the Service can't reach it.
            # OpenWebUI sends the same value as a bearer token.
            - name: LOCAL_BACKEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openhands-secret-key
                  key: LOCAL_BACKEND_API_KEY
            - name: OH_SESSION_API_KEYS_0
              valueFrom:
                secretKeyRef:
                  name: openhands-secret-key
                  key: LOCAL_BACKEND_API_KEY
            # OpenTelemetry traces. The OpenHands SDK auto-enables OTLP export
            # when these env vars are present (presence-gated, no code change).
            # HTTP/protobuf to the in-cluster collector on :4318 keeps it
            # plaintext (no TLS/insecure-flag ambiguity). The agent-server sits
            # behind the openwebui-openhands-proxy, which forwards OpenWebUI's
            # traceparent so agent.step / tool / LLM spans attach to the same
            # distributed trace as the proxy's spans.
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://backend-collector.observability.svc.cluster.local:4318/v1/traces"
            - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "openhands"
            # LLM config is NOT read from env in this image version (only
            # DEBUG_LLM is). It is pinned via the openhands-llm-config ConfigMap
            # and openhands-secret-key Secret, mounted read-only below.
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /home/openhands/.openhands
              subPath: openhands
            - name: data
              mountPath: /home/openhands/workspace
              subPath: workspace
            # LLM config materialized by the init-dirs container into writable
            # in-memory dirs (Git stays source of truth — reset on pod restart).
            # settings.json is copied onto the PVC by init-dirs.
            - name: profiles-mem
              mountPath: /home/openhands/.openhands/profiles
            - name: agent-profiles-mem
              mountPath: /home/openhands/.openhands/agent-profiles
            # Encryption key — read-only (OpenHands reads, never writes it).
            - name: secret-key
              mountPath: /home/openhands/.openhands/agent-canvas/secret-key.txt
              subPath: secret-key.txt
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: openhands-llm-config
            defaultMode: 0444
        - name: secret-key
          secret:
            secretName: openhands-secret-key
            defaultMode: 0444
        # In-memory config dirs, populated from the ConfigMap by init-dirs.
        - name: profiles-mem
          emptyDir:
            medium: Memory
        - name: agent-profiles-mem
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: openebs-cache
        resources:
          requests:
            storage: 20Gi
