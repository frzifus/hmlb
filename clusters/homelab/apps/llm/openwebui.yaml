---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: llm
spec:
  storageClassName: openebs-cache
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.3
          ports:
            - containerPort: 8080
          env:
            - name: ENABLE_API_KEYS
              value: "true"
            - name: JWT_EXPIRES_IN
              value: "-1"
            # One connection per semicolon-separated entry; index order must
            # match OPENAI_API_KEYS and OPENAI_API_CONFIGS.
            - name: OPENAI_API_BASE_URLS
              value: "http://openwebui-openhands-proxy.llm.svc.cluster.local:8080/v1;http://hermes-research:8642/v1;http://hermes-hass:8642/v1;http://hermes-homelab:8642/v1"
            # Positional keys: 0 = OpenHands (LOCAL_BACKEND_API_KEY), 1-3 = the
            # hermes agents (hermes-internal-key). Assembled manually in the
            # openwebui-secrets Secret (key OPENAI_API_KEYS) — if the OpenHands
            # key rotates, regenerate that joined string.
            - name: OPENAI_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: openwebui-secrets
                  key: OPENAI_API_KEYS
            # Per-connection settings; hermes agents use the Responses API so
            # native tool cards render (chat-completions drops them).
            - name: OPENAI_API_CONFIGS
              value: '{"0": {}, "1": {"api_type": "responses"}, "2": {"api_type": "responses"}, "3": {"api_type": "responses"}}'
            # Pin the JWT signing key so API tokens survive restarts (see the
            # openwebui-secret-key Secret above).
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-secret-key
                  key: WEBUI_SECRET_KEY
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"
            # Background tasks (title/tags/follow-up/query generation) are routed
            # to Ollama deepseek directly instead of the chat connection. When the
            # chat model is external (OpenHands/OpenAI) OpenWebUI uses
            # TASK_MODEL_EXTERNAL; when it's an Ollama model it uses TASK_MODEL.
            # The task model is resolved by name across all connections, so an
            # Ollama model name here routes the task call to Ollama.
            - name: TASK_MODEL
              value: "glm-5.3-flash:cloud"
            - name: TASK_MODEL_EXTERNAL
              value: "glm-5.3-flash:cloud"
            - name: ENABLE_OTEL
              value: "true"
            - name: ENABLE_OTEL_TRACES
              value: "true"
            - name: ENABLE_OTEL_METRICS
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://backend-collector.observability.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: AUDIO_TTS_ENGINE
              value: "openai"
            - name: AUDIO_TTS_MODEL
              value: "hexgrad/Kokoro-82M"
            - name: AUDIO_TTS_VOICE
              value: "af_sarah"
            - name: AUDIO_TTS_SPLIT_ON
              value: "punctuation"
            - name: AUDIO_TTS_API_KEY
              value: "fake"
            - name: AUDIO_TTS_OPENAI_API_BASE_URL
              value: "http://whisper-open-ai:8000/v1"
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            - name: ENABLE_OAUTH_PERSISTENT_CONFIG
              value: "false"
            - name: ENABLE_LOGIN_FORM
              value: "false"
            - name: ENABLE_SIGNUP
              value: "false"
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: DEFAULT_USER_ROLE
              value: "user"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: OPENID_PROVIDER_URL
              value: "https://auth.klimlive.de/application/o/llm/.well-known/openid-configuration"
            - name: OAUTH_SCOPES
              valueFrom:
                secretKeyRef:
                  name: openwebui-secrets
                  key: OAUTH_SCOPES
            - name: OAUTH_PROVIDER_NAME
              valueFrom:
                secretKeyRef:
                  name: openwebui-secrets
                  key: OAUTH_PROVIDER_NAME
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: openwebui-secrets
                  key: OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openwebui-secrets
                  key: OAUTH_CLIENT_SECRET
          volumeMounts:
            - mountPath: /app/backend/data
              name: open-webui-data
          resources:
            limits:
              cpu: "1"
              memory: "3Gi"
      volumes:
        - name: open-webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: llm
spec:
  selector:
    app: open-webui
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 8080
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  namespace: llm
  # labels:
  #   external-dns: "true"
spec:
  parentRefs:
    - name: services
      namespace: infra
      sectionName: main
  hostnames: [
    "llm.klimlive.de"
  ]
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: open-webui
          port: 3000
