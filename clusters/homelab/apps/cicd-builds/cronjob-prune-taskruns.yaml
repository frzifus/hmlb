---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prune-taskruns
  namespace: cicd-builds
spec:
  # Run daily at 06:00 UTC, before the builds start
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: build-bot
          restartPolicy: OnFailure
          containers:
            - name: prune
              image: rancher/kubectl:v1.36.2
              command: ["/bin/sh", "-c"]
              args:
                - |
                  KEEP=3
                  echo "Pruning TaskRuns, keeping last $KEEP per build type..."
                  kubectl get taskruns -n cicd-builds \
                    -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.creationTimestamp}{"\n"}{end}' \
                  | sort -k2 -r \
                  | while read name ts; do
                      prefix=$(echo "$name" | sed 's/-[a-z0-9]\{5\}$//')
                      echo "$prefix $name"
                    done \
                  | awk '{
                      count[$1]++
                      if (count[$1] > 3) print $2
                    }' \
                  | xargs -r kubectl delete taskrun -n cicd-builds
                  echo "Done."
