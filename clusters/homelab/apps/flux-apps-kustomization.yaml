---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-apps
  namespace: flux-system
spec:
  dependsOn:
    - name: homelab
  interval: 10m
  path: "./clusters/homelab/apps"
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  decryption:
    provider: sops
    secretRef:
      name: sops-age
