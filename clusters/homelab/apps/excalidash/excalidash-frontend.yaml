---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: excalidash
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: excalidash-frontend
      app.kubernetes.io/instance: excalidash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: excalidash-frontend
        app.kubernetes.io/instance: excalidash
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1
      hostUsers: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: excalidash-frontend
          image: zimengxiong/excalidash-frontend:0.6.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "NET_BIND_SERVICE", "SETGID", "SETUID"]
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: excalidash-frontend
  namespace: excalidash
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: excalidash-frontend
    app.kubernetes.io/instance: excalidash
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
