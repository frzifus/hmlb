---
apiVersion: v1
kind: Namespace
metadata:
  name: vpn-proxy
  labels:
    # NOTE: gluetun needs NET_ADMIN + root (iptables), which fails baseline
    # and restricted PSA. This namespace is the designated escape hatch for
    # shared VPN workloads only - keep it free of regular apps.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
