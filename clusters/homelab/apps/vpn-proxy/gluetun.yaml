---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gluetun
  namespace: vpn-proxy
  labels:
    app: gluetun
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gluetun
  template:
    metadata:
      labels:
        app: gluetun
    spec:
      affinity:
        podAntiAffinity: # NOTE: spread replicas across nodes for availability.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: gluetun
                topologyKey: kubernetes.io/hostname
      containers:
        - name: gluetun
          image: qmcgaw/gluetun:v3.41
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_TYPE
              value: "wireguard"
            - name: VPN_SERVICE_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: vpn-secret
                  key: VPN_SERVICE_PROVIDER
            - name: DOT
              valueFrom:
                secretKeyRef:
                  name: vpn-secret
                  key: DOT
            - name: DNS_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: vpn-secret
                  key: DNS_ADDRESS
            # NOTE: clients reach the proxies cross-pod via eth0, so these
            # ports must be open on the default interface (kube sidecar pattern).
            - name: FIREWALL_INPUT_PORTS
              value: "8388,8888,8000"
            - name: SERVER_CITIES
              valueFrom:
                secretKeyRef:
                  name: vpn-secret
                  key: SERVER_CITIES
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: vpn-secret
                  key: WIREGUARD_ADDRESSES
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: vpn-secret
                  key: WIREGUARD_PRIVATE_KEY
            # NOTE: gluetun v3.41 has no SOCKS5 server (removed upstream;
            # SOCKS5_ENABLED is silently ignored). Shadowsocks is the
            # supported cross-pod proxy; ss-local sidecars re-expose it as
            # SOCKS5 for clients like SABnzbd.
            - name: SHADOWSOCKS
              value: "on"
            - name: SHADOWSOCKS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gluetun-shadowsocks
                  key: SHADOWSOCKS_PASSWORD
            # NOTE: expose the HTTP proxy as a fallback for clients without
            # SOCKS5 support (default off, listens on :8888).
            - name: HTTPPROXY
              value: "on"
          ports:
            - name: shadowsocks
              containerPort: 8388
              protocol: TCP
            - name: http-proxy
              containerPort: 8888
              protocol: TCP
            - name: control
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "/gluetun-entrypoint healthcheck"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "/gluetun-entrypoint healthcheck"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gluetun
  namespace: vpn-proxy
  labels:
    app: gluetun
spec:
  selector:
    app: gluetun
  ports:
    - name: shadowsocks
      protocol: TCP
      port: 8388
      targetPort: shadowsocks
    - name: http-proxy
      protocol: TCP
      port: 8888
      targetPort: http-proxy
    - name: control
      protocol: TCP
      port: 8000
      targetPort: control
  type: ClusterIP
