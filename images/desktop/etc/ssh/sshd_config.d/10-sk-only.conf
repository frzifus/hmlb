# SSH hardening for the desktop image: key-only access, FIDO2 (sk) keys only.
# Fedora's sshd_config carries `Include /etc/ssh/sshd_config.d/*.conf` at the
# top, and sshd honours first-obtained-value-wins, so this drop-in is
# authoritative for every keyword set here.
PasswordAuthentication no
KbdInteractiveAuthentication no
GSSAPIAuthentication no
PubkeyAuthentication yes

# Restrict public-key authentication to FIDO2/security-key algorithms, so only
# sk-ssh keys (as published at https://github.com/frzifus.keys) can ever
# authenticate — plain ed25519/RSA/ECDSA keys are rejected outright.
PubkeyAcceptedAlgorithms sk-ssh-ed25519@openssh.com,sk-ssh-ed25519-cert@openssh.com,sk-ecdsa-sha2-nistp256@openssh.com,sk-ecdsa-sha2-nistp256-cert@openssh.com

# Root is the only account guaranteed to exist on a fresh machine (usernames
# are unknown at image time), so the system key store targets it:
# /etc/ssh/authorized_keys.d/<user>. User home keys keep working as well.
PermitRootLogin prohibit-password
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u