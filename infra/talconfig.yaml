---
clusterName: homelab
talosVersion: v1.14.0
kubernetesVersion: v1.37.0
endpoint: https://192.168.5.3:6443
allowSchedulingOnMasters: false
additionalApiServerCertSans:
  - home-cluster
cniConfig:
  name: none
patches:
  # https://spegel.dev/docs/getting-started/#talos
  - |-
    machine:
      files:
        - path: /etc/cri/conf.d/20-customization.part
          op: create
          content: |
            [plugins."io.containerd.cri.v1.images"]
              discard_unpacked_layers = false
      sysctls:
        net.ipv4.ip_unprivileged_port_start: "0"
      systemDiskEncryption:
        state:
          provider: luks2
          keys:
            - tpm: {}
              slot: 0
        ephemeral:
          provider: luks2
          keys:
            - static:
                passphrase: ${diskEncryption}
              slot: 0
  - |-
    machine:
      kubelet:
        extraConfig:
          featureGates:
            UserNamespacesSupport: true
        extraMounts:
          - destination: /var/local
            type: bind
            source: /var/local
            options:
              - bind
              - rshared
              - rw

# NOTE: Contains
# schematic:
#   customization:
#     systemExtensions:
#         officialExtensions:
#             - siderolabs/amdgpu
#             - siderolabs/gvisor
#             - siderolabs/i915
#             - siderolabs/intel-ucode
#             - siderolabs/mei
#             - siderolabs/tailscale

controlPlane:
  patches:
    - |-
      apiVersion: v1alpha1
      kind: KubeAPIServerConfig
      image: registry.k8s.io/kube-apiserver:v1.37.0
      extraArgs:
        feature-gates: UserNamespacesSupport=true
    - |-
      apiVersion: v1alpha1
      kind: KubeProxyConfig
      enabled: false
    - |-
      machine:
        features:
          kubernetesTalosAPIAccess:
            enabled: true
            allowedRoles:
              - os:etcd:backup
            allowedKubernetesNamespaces:
              - kube-system
  talosImageURL: factory.talos.dev/metal-installer-secureboot/ec5a345a9a57a94b4271f600874fc8b9a0ea87e3148c50472fe806e1ab23b1d7
  extensionServices:
    - name: tailscale
      environment:
        - TS_AUTHKEY=${tsAuth}
        - TS_EXTRA_ARGS=--reset

worker:
  talosImageURL: factory.talos.dev/metal-installer-secureboot/ec5a345a9a57a94b4271f600874fc8b9a0ea87e3148c50472fe806e1ab23b1d7
  extensionServices:
    - name: tailscale
      environment:
        - TS_AUTHKEY=${tsAuth}
        - TS_EXTRA_ARGS=--reset
  patches:
    - |- # Worker node hardening (see post-mortems/2026-09-05-storage1-node-outage.md)
      machine:
        sysctls:
          kernel.panic: "10"
          kernel.panic_on_oops: "1"
        kubelet:
          extraConfig:
            kubeReserved:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"

nodes:
  - hostname: master1
    ipAddress: 192.168.5.10
    installDisk: /dev/nvme0n1
    controlPlane: true
  - hostname: master2
    ipAddress: 192.168.5.3
    installDisk: /dev/sda
    controlPlane: true
  - hostname: master3
    ipAddress: 192.168.5.4
    installDisk: /dev/nvme0n1
    controlPlane: true
  - hostname: storage1
    ipAddress: 192.168.5.6
    installDisk: /dev/nvme0n1
    controlPlane: false
    patches:
      - |-
        machine:
          sysctls:
            vm.nr_hugepages: "1024"
      - |- # Storage node hardening (see post-mortems/2026-09-05-storage1-node-outage.md)
        apiVersion: v1alpha1
        kind: WatchdogTimerConfig
        device: /dev/watchdog0
        timeout: 10m
      - |- # https://www.talos.dev/v1.9/advanced/advanced-networking/#bonding
        machine:
          network:
            interfaces:
              - interface: bond0
                dhcp: true
                bond:
                  mode: 802.3ad
                  lacpRate: fast
                  xmitHashPolicy: layer3+4
                  miimon: 100
                  updelay: 200
                  downdelay: 200
                  interfaces:
                    - enp1s0
                    - enp2s0
    nodeLabels:
      openebs.io/engine: mayastor
      role: "storage-node"
    nodeTaints:
      role: "storage-node:NoExecute"
  - hostname: storage2
    ipAddress: 192.168.5.8
    installDisk: /dev/nvme0n1
    controlPlane: false
    patches:
      - |-
        machine:
          sysctls:
            vm.nr_hugepages: "1024"
      - |- # Storage node hardening (see post-mortems/2026-09-05-storage1-node-outage.md)
        apiVersion: v1alpha1
        kind: WatchdogTimerConfig
        device: /dev/watchdog0
        timeout: 10m
      - |- # https://www.talos.dev/v1.9/advanced/advanced-networking/#bonding
        machine:
          network:
            interfaces:
              - interface: bond0
                dhcp: true
                bond:
                  mode: 802.3ad
                  lacpRate: fast
                  xmitHashPolicy: layer3+4
                  miimon: 100
                  updelay: 200
                  downdelay: 200
                  interfaces:
                    - enp1s0
                    - enp2s0
    nodeLabels:
      role: "storage-node"
      openebs.io/engine: mayastor
    nodeTaints:
      role: "storage-node:NoExecute"
  - hostname: worker1
    ipAddress: 192.168.5.9
    installDisk: /dev/nvme0n1
    controlPlane: false
    patches:
      - |-
        machine:
          sysctls:
            user.max_user_namespaces: "11255"
  - hostname: worker2
    ipAddress: 192.168.5.84
    installDisk: /dev/nvme0n1
    controlPlane: false
    patches:
      - |-
        machine:
          sysctls:
            user.max_user_namespaces: "11255"
    nodeLabels:
      node-role.kubernetes.io/worker: ""
  - hostname: gpu1
    ipAddress: 192.168.5.7
    installDisk: /dev/sda
    controlPlane: false
    patches:
      - |-
        machine:
          sysctls:
            user.max_user_namespaces: "11255"
  - hostname: gpu2
    ipAddress: 192.168.5.11
    installDisk: /dev/nvme0n1
    controlPlane: false
    patches:
      - |-
        machine:
          sysctls:
            user.max_user_namespaces: "11255"
      - |- # https://www.talos.dev/v1.9/advanced/advanced-networking/#bonding
        machine:
          network:
            interfaces:
              - interface: bond0
                dhcp: true
                bond:
                  mode: 802.3ad
                  lacpRate: fast
                  xmitHashPolicy: layer3+4
                  miimon: 100
                  updelay: 200
                  downdelay: 200
                  interfaces:
                    - eno1
                    - enp7s0
